<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Memory of Civilizations</title>
  <meta name="description" content="A walkable, realistic world of architecture from every age and civilization.">
  <meta name="theme-color" content="#1b1712">
  <link rel="stylesheet" href="src/ui/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <button id="btn-lang" class="icon lang" aria-label="中文 / English"></button>

  <button id="corner-open" class="icon" aria-label="Show the map and the clock" data-i18n-label="card-show" hidden>
    <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 2.2 6 2v11.6l-6-2V6.2Z"/></svg>
  </button>
  <div id="corner" class="corner-card" hidden>
    <button id="corner-fold" class="fold" aria-label="Fold the card" data-i18n-label="card-fold">&minus;</button>
    <div id="minimap" class="minimap" title="Map (M)" data-i18n-title="map-open">
      <canvas id="minimap-canvas"></canvas>
      <div id="minimap-region" class="mm-region"></div>
    </div>
    <div id="status" class="status">
      <div class="row time-row">
        <span id="clock-icon" class="clock-icon"></span>
        <span id="clock-time" class="big">16:30</span>
        <button id="clock-play" class="round" aria-label="Pause or run the time" data-i18n-label="t-pause"></button>
      </div>
      <div id="clock-period" class="period"></div>
      <input id="clock-hour" class="sky-range" type="range" min="0" max="24" step="0.1" aria-label="Time of day" data-i18n-label="time">
      <div class="row speed-row">
        <span id="gait-icon" class="gait-icon" aria-hidden="true"></span>
        <span id="speed-name" class="speed-name"></span>
        <span class="speed-num"><b id="speed-kmh">0</b> <small>km/h</small></span>
      </div>
      <div class="row alt-row"><span id="speed-alt" class="dim"></span></div>
      <div class="speed-bar"><i id="speed-bar"></i></div>
    </div>
  </div>

  <div id="stick" hidden><div id="stick-knob"></div></div>
  <div id="touch-btns" hidden><button id="btn-fly" class="icon" aria-label="Hold to fly" data-i18n-label="fly-hold"><svg viewBox="0 0 24 24"><path d="M12 4 5 11h4.5v9h5v-9H19Z"/></svg></button></div>

  <section id="intro" class="intro">
    <h1 data-i18n="title">Memory of Civilizations</h1>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="intro-status" class="status" data-i18n="loading">Preparing the world…</p>
  </section>

  <section id="map" class="panel map" hidden>
    <header><h2 data-i18n="map">Map</h2><button class="close" aria-label="Close">×</button></header>
    <canvas id="map-canvas"></canvas>
    <p class="map-hint" data-i18n="map-hint">Click anywhere on the map to go there; near a building, or on its name, you arrive at its entrance.</p>
    <ul id="map-list"></ul>
  </section>


  <div id="fade" class="fade" hidden></div>
  <div id="notice" class="notice" hidden></div>
  <div id="click-hint" class="click-hint" hidden><span data-i18n="click-to-look">Click to look around</span><small data-i18n="controls-desktop">W A S D to walk · mouse to look · Shift to run · M for the map · Esc to pause</small></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
