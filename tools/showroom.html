<script type="module">
// A showroom of elements (the objects of life, src/objects/, or any style's), lit simply, for tools/showroom.mjs.
import * as THREE from 'three/webgpu';
import { buildPlan } from '../src/core/build.js';
import '../src/objects/index.js';
import '../src/styles/vernacular/houses-med.js';
import { material } from '../src/engine/materials.js';
import { ENV } from '../src/engine/env.js';
const q = new URLSearchParams(location.search);
const items = JSON.parse(q.get('items'));
const cols = +(q.get('cols') || 6), gap = +(q.get('gap') || 4);
const inplace = q.get('inplace') === '1';
// in a row, each at its place in the grid; in place (--inplace), where the items say
const elements = inplace ? items.map((it, i) => ({ seed: 7 + i * 13, ...it })) : items.map((it, i) => { const x = (i % cols) * gap, z = Math.floor(i / cols) * gap; return it.rect ? { seed: 7 + i * 13, y: 0, foot: -0.3, ...it, rect: [x + it.rect[0], z + it.rect[1], x + it.rect[2], z + it.rect[3]] } : { seed: 7 + i * 13, rot: 0.5, ...it, at: [x, z], y: it.y ?? 0 }; });
// a style's name (src/styles/<name>/index.js) or a module's path from the root (tools/showroom.mjs)
for (const m of (q.get('imports') || '').split(',').filter(Boolean)) await import(m.startsWith('/') ? m : `../src/styles/${m}/index.js`);
const groups = new Map();
for (const e of elements) { const st = e.style || q.get('style') || 'life'; if (!groups.has(st)) groups.set(st, []); groups.get(st).push(e); }
const built = { parts: [] };
for (const [st, els] of groups) built.parts.push(...buildPlan({ id: 'showroom-' + st, style: st, origin: [0, 0], base: 0, yaw: 0, elements: els, rooms: [], bounds: [-5000, -5000, 5000, 5000], entrance: { at: [0, 0], facing: 'n' } }).parts);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c8);
const box = new THREE.Box3();
for (const { mat, geometry } of built.parts) { scene.add(new THREE.Mesh(geometry, material(mat))); geometry.computeBoundingBox(); box.union(geometry.boundingBox); }
if (box.isEmpty()) box.set(new THREE.Vector3(), new THREE.Vector3());
// the ground: at a height, or none (--ground off: hulls, the undersides of bridges)
if (q.get('ground') !== 'off') {
  const size = Math.max(200, 2 * Math.max(...box.min.toArray().map(Math.abs), ...box.max.toArray().map(Math.abs)) + 50);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8a7a62, roughness: 1 }));
  ground.position.y = +(q.get('ground') || 0);
  scene.add(ground);
}
const sun = new THREE.DirectionalLight(0xfff2dd, 3); sun.position.set(-20, 30, 15); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfd2ea, 0x6b5a45, 1.2));
ENV.night.value = +(q.get('night') || 0);
const W = (cols - 1) * gap, H = Math.floor((items.length - 1) / cols) * gap;
// the default view: over the row, or (in place) from the south-east, far enough to frame the items' bounds
const c = box.getCenter(new THREE.Vector3()), r = Math.max(2, box.getSize(new THREE.Vector3()).length() / 2);
const far = Math.max(500, r * 8);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, Math.max(0.05, far / 20000), far);
const [cx, cy, cz] = (q.get('cam') || (inplace ? `${c.x + r * 1.2},${c.y + r * 0.9},${c.z + r * 1.9}` : `${W / 2},${Math.max(W, H) * 0.55 + 2},${H + Math.max(W, H) * 0.75 + 3}`)).split(',').map(Number);
cam.position.set(cx, cy, cz);
const look = (q.get('look') || (inplace ? `${c.x},${c.y},${c.z}` : `${W / 2},0.6,${H / 2}`)).split(',').map(Number); cam.lookAt(...look);
window.INFO = { min: box.min.toArray(), max: box.max.toArray(), cam: [cx, cy, cz], look };
await renderer.renderAsync(scene, cam);
await renderer.renderAsync(scene, cam);
window.DONE = true;
</script></body></html>
