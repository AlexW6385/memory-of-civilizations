<!doctype html>
<html><head><meta charset="utf-8"><base href="/"><title>Objects showroom</title>
<style>html,body{margin:0;background:#888;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"/src/vendor/three/build/three.webgpu.js","three/webgpu":"/src/vendor/three/build/three.webgpu.js","three/tsl":"/src/vendor/three/build/three.tsl.js","three/addons/":"/src/vendor/three/examples/jsm/"}}</script>
</head><body><canvas id="view"></canvas>
<script type="module">
// The showroom of tools/showroom.mjs. Two modes:
//  - elements (the objects of life, src/objects/, or any style's), laid out in a row or in place;
//  - a settlement's view (cfg.site): its ground, the plans within cfg.radius of the camera and the
//    life of its streets, from a pose, as the game draws it.
// Lit as the game is (cfg.light 'game': src/engine/renderer.js — the sky, the sun's cascaded
// shadows, the climate's indirect light and reflections, GTAO, bloom, AgX), or (cfg.light 'simple')
// by a sun and a hemisphere light, metals still reflecting the climate's sky/ground fallback.
// The configuration comes from /__showroom/config.json (served by tools/showroom.mjs, any size),
// or else from the address (?items=…&style=…, the old form).
import * as THREE from 'three/webgpu';
import { buildPlan } from '../src/core/build.js';
import '../src/objects/index.js';
import '../src/styles/vernacular/houses-med.js';
import { material, useGI } from '../src/engine/materials.js';
import { ENV } from '../src/engine/env.js';
import { GIVolume } from '../src/engine/gi.js';
import { Climate, sunPlanet, moonPlanet, forceWeather } from '../src/engine/climate.js';
import { Rain } from '../src/engine/rain.js';
import { dirToLocal, toPlanet, latLon, enuFrame } from '../src/planet/geo.js';
import { BUILT_BY_ID, PLANET_RADIUS, BLEND } from '../src/planet/relief.js';
import { REGION } from '../src/world/regions.js';
import { EYE } from '../src/core/walk.js';

const T0 = performance.now(), TIMES = window.TIMES = {};
const mark = (k) => { TIMES[k] = +((performance.now() - T0) / 1000).toFixed(1); console.info(`[showroom] ${k} ${TIMES[k]}s`); };
let cfg;
try { const r = await fetch('/__showroom/config.json'); if (r.ok) cfg = await r.json(); } catch { /* not served */ }
if (!cfg) {
  // the old form: everything in the address
  const q = new URLSearchParams(location.search);
  cfg = Object.fromEntries(q.entries());
  cfg.items = JSON.parse(q.get('items') || '[]');
  cfg.inplace = q.get('inplace') === '1';
  cfg.imports = (q.get('imports') || '').split(',').filter(Boolean);
  cfg.light = q.get('light') || 'simple';
}
const num = (v, d) => (v === undefined || v === null || v === '' ? d : +v);
const vec = (s) => (typeof s === 'string' ? s.split(',').map(Number) : s);
const lightMode = cfg.light || 'game';
const climateSite = BUILT_BY_ID[cfg.site || cfg.climate || 'athens'] || BUILT_BY_ID.athens;
const climateOf = (S) => S.ground?.climate || REGION[S.focus.region].climate;
// the hour (local solar time): as asked; --night 1 is ten at night; else mid-morning
const hour = num(cfg.hour, +cfg.night ? 22 : 10.5);

// one shared helper of the viewer's (src/engine/world.js): every mesh instanced, with instance colours
const IDENTITY = new THREE.Matrix4().elements;
function buildingMesh(geometry, mat, matrices = IDENTITY, colors = null) {
  const n = matrices.length / 16;
  const m = new THREE.InstancedMesh(geometry, material(mat), n);
  m.instanceMatrix.array.set(matrices); m.instanceMatrix.needsUpdate = true;
  if (!colors) { colors = new Float32Array(n * 3).fill(1); }
  m.instanceColor = new THREE.InstancedBufferAttribute(colors, 3);
  m.computeBoundingSphere();
  return m;
}

// ── the renderer ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('view');
let R = null, renderer, scene, cam, gi;
if (lightMode === 'game') {
  const { Renderer } = await import('../src/engine/renderer.js');
  R = await new Renderer(canvas).init(cfg.quality || 'high');
  renderer = R.renderer; scene = R.scene; cam = R.camera; gi = R.gi;
} else {
  renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight, false); renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.1;
  await renderer.init();
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c8);
  cam = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.05, 1000);
  cam.layers.mask = (await import('../src/engine/layers.js')).CAMERA_MASK;
  cam.rotation.order = 'YXZ';
  // reflections (and only those: the hemisphere light below lights the diffuse) from the baked-light
  // volume's open-air fallback, as the game's metals have outside every volume
  gi = new GIVolume(); gi.irradianceNode(); useGI(gi);
}
// the field of view: the game's (68°, 78° on a portrait screen), or as asked
const fov = num(cfg.fov, innerWidth < innerHeight ? 78 : 68);
const setFov = () => { cam.fov = fov; cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
setFov();
mark('renderer');

// ── the climate: the sky, the sun and the indirect light of a settlement at an hour ─────────────
if (cfg.weather) forceWeather(cfg.weather);
const climate = R ? new Climate(R) : null;
function sky(S, frame, up = [0, 1, 0], zones = null) {
  if (!climate) return null;
  climate.lonHours = latLon(S.u)[1] / 15;
  climate.hour = hour; climate.setTime('held');
  return climate.update({ sun: dirToLocal(frame, sunPlanet(climate.utc)), moon: dirToLocal(frame, moonPlanet(climate.utc)), up, zones: zones || [{ zone: { id: S.id, climate: climateOf(S) }, w: 1 }] }, 0.016);
}
function setFrame(frame) {
  ENV.planetO.value.set(frame.o[0], frame.o[1], frame.o[2]);
  ENV.planetM.value.set(frame.x[0], frame.y[0], frame.z[0], frame.x[1], frame.y[1], frame.z[1], frame.x[2], frame.y[2], frame.z[2]);
}
const exposureOf = (cl) => cl.exposure * (1 + 2.6 * (1 - cl.day));

let LAST_DRAWS = null;
// Drawn into a target and read back unless ?off=0: presenting to a WebGPU canvas fails in some
// headless set-ups ("A valid external Instance reference no longer exists"), drawing to a target works.
const OFFSCREEN = new URLSearchParams(location.search).get('off') !== '0';
const OFF = new THREE.RenderTarget(1, 1, { type: THREE.HalfFloatType });
async function draw(frames, before = () => {}) {
  if (OFFSCREEN) { const sz = renderer.getDrawingBufferSize(new THREE.Vector2()); OFF.setSize(sz.x, sz.y); renderer.setRenderTarget(OFF); }
  for (let k = 0; k < frames; k++) {
    before(k);
    renderer.info.reset();
    if (!R) renderer.render(scene, cam);
    else if (k === 0) R.render();
    else {
      // after the first frame (which makes the sun's cascades), every cascade drawn each frame (the
      // game draws the outer ones every second and third frame): two frames make the whole picture
      R.update();
      // (and each cascade's layers, as R.render sets them: the first frame's came before the cascades
      // existed — casters by size per cascade, src/engine/layers.js)
      const { cascadeMask } = await import('../src/engine/layers.js');
      const Ls = R.sun.shadow.shadowNode?.lights || [];
      Ls.forEach((l, i) => { l.shadow.needsUpdate = true; l.shadow.camera.layers.mask = cascadeMask(i, Ls.length); });
      R.pipeline.render();
    }
    // (read now: the renderer's own frame loop resets the counts at the next animation frame)
    LAST_DRAWS = { drawCalls: renderer.info.render.drawCalls, triangles: renderer.info.render.triangles };
    const d = renderer.backend?.device; if (d) await d.queue.onSubmittedWorkDone();
    mark('frame' + (k + 1));
  }
}

if (cfg.site) await siteView(); else await elements();
if (OFFSCREEN) {
  const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
  const px = await renderer.readRenderTargetPixelsAsync(OFF, 0, 0, sz.x, sz.y);
  const c2 = document.createElement('canvas'); c2.width = sz.x; c2.height = sz.y; c2.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh';
  const g = c2.getContext('2d'), im = g.createImageData(sz.x, sz.y);
  const h = (v) => THREE.DataUtils.fromHalfFloat(v), enc = (v) => Math.round(255 * Math.min(1, Math.max(0, v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055)));
  const half = px instanceof Uint16Array;
  for (let y = 0; y < sz.y; y++) for (let x = 0; x < sz.x; x++) {
    const i = (y * sz.x + x) * 4, o = (y * sz.x + x) * 4;
    for (let k = 0; k < 3; k++) im.data[o + k] = window.OFF_SRGB ? enc(half ? h(px[i + k]) : px[i + k]) : Math.round(255 * Math.min(1, Math.max(0, half ? h(px[i + k]) : px[i + k])));
    im.data[o + 3] = 255;
  }
  g.putImageData(im, 0, 0); document.body.appendChild(c2);
  document.getElementById('view').remove();
}
window.DONE = true;

// ── elements ───────────────────────────────────────────────────────────────────
async function elements() {
  const items = cfg.items;
  const cols = num(cfg.cols, 6), gap = num(cfg.gap, 4), inplace = !!cfg.inplace;
  // in a row, each at its place in the grid; in place (--inplace), where the items say
  const elements = inplace ? items.map((it, i) => ({ seed: 7 + i * 13, ...it })) : items.map((it, i) => { const x = (i % cols) * gap, z = Math.floor(i / cols) * gap; return it.rect ? { seed: 7 + i * 13, y: 0, foot: -0.3, ...it, rect: [x + it.rect[0], z + it.rect[1], x + it.rect[2], z + it.rect[3]] } : { seed: 7 + i * 13, rot: 0.5, ...it, at: [x, z], y: it.y ?? 0 }; });
  // a style's name (src/styles/<name>/index.js) or a module's path from the root (tools/showroom.mjs)
  for (const m of cfg.imports || []) await import(m.startsWith('/') ? m : `../src/styles/${m}/index.js`);
  const groups = new Map();
  for (const e of elements) { const st = e.style || cfg.style || 'life'; if (!groups.has(st)) groups.set(st, []); groups.get(st).push(e); }
  // the tools' triangle soups, or (--weld) the viewer's own build: welded, 16-bit normals, instanced repeats
  const opts = cfg.weld ? { instancing: true, detail: true } : {};
  const meshes = [];
  for (const [st, els] of groups) {
    const b = buildPlan({ id: 'showroom-' + st, style: st, origin: [0, 0], base: 0, yaw: 0, elements: els, rooms: [], bounds: [-5000, -5000, 5000, 5000], entrance: { at: [0, 0], facing: 'n' } }, opts);
    for (const { mat, geometry } of b.parts) meshes.push(cfg.weld ? buildingMesh(geometry, mat) : new THREE.Mesh(geometry, material(mat)));
    for (const { mat, geometry, matrices, colors } of b.instanced || []) meshes.push(buildingMesh(geometry, mat, matrices, colors));
  }
  mark('build');
  const stats = { meshes: meshes.length, indexed: meshes.filter((m) => m.geometry.index).length, instanced: meshes.filter((m) => m.isInstancedMesh && m.count > 1).length, int16: meshes.filter((m) => m.geometry.attributes.normal?.array instanceof Int16Array).length };
  const box = new THREE.Box3();
  for (const m of meshes) { m.castShadow = m.receiveShadow = true; scene.add(m); m.updateMatrixWorld(); box.union(new THREE.Box3().setFromObject(m)); }
  if (box.isEmpty()) box.set(new THREE.Vector3(), new THREE.Vector3());
  // the ground: at a height, or none (--ground off: hulls, the undersides of bridges)
  if (cfg.ground !== 'off') {
    const size = Math.max(200, 2 * Math.max(...box.min.toArray().map(Math.abs), ...box.max.toArray().map(Math.abs)) + 50);
    const gm = R ? material('ground') : new THREE.MeshStandardMaterial({ color: 0x8a7a62, roughness: 1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2), gm);
    ground.position.y = num(cfg.ground, 0); ground.receiveShadow = true;
    scene.add(ground);
  }
  const W = (cols - 1) * gap, H = Math.floor((items.length - 1) / cols) * gap;
  // the default view: over the row, or (in place) from the south-east, far enough to frame the
  // items' bounds (the distances were chosen for a 40° view: scaled to the field of view in force)
  const c = box.getCenter(new THREE.Vector3()), r = Math.max(2, box.getSize(new THREE.Vector3()).length() / 2);
  const look = vec(cfg.look || (inplace ? `${c.x},${c.y},${c.z}` : `${W / 2},0.6,${H / 2}`));
  let pos;
  if (cfg.cam) pos = vec(cfg.cam);
  else {
    const p = inplace ? [c.x + r * 1.2, c.y + r * 0.9, c.z + r * 1.9] : [W / 2, Math.max(W, H) * 0.55 + 2, H + Math.max(W, H) * 0.75 + 3];
    const k = Math.tan(20 * Math.PI / 180) / Math.tan(fov / 2 * Math.PI / 180);
    pos = p.map((v, i) => look[i] + (v - look[i]) * k);
  }
  const far = Math.max(500, r * 8, Math.hypot(pos[0] - look[0], pos[1] - look[1], pos[2] - look[2]) * 4);
  cam.near = Math.max(0.05, far / 20000); cam.far = R ? Math.max(far, 4000) : far; setFov();
  cam.position.set(...pos); cam.lookAt(...look); cam.updateMatrixWorld();
  window.INFO = { min: box.min.toArray(), max: box.max.toArray(), cam: pos, look, fov, stats };
  if (R) {
    const S = climateSite, frame = enuFrame(S.u, PLANET_RADIUS);
    setFrame(frame);
    ENV.camAlt.value = Math.max(2, pos[1]);
    const cl = sky(S, frame);
    renderer.toneMappingExposure = exposureOf(cl);
    window.INFO.sky = { site: S.id, hour, exposure: renderer.toneMappingExposure };
    R.sky.horizonDip.value = 0;
  } else {
    const sun = new THREE.DirectionalLight(0xfff2dd, 3); sun.position.set(-20, 30, 15); scene.add(sun);
    scene.add(new THREE.HemisphereLight(0xbfd2ea, 0x6b5a45, 1.2));
    ENV.night.value = +(cfg.night || 0);
  }
  await draw(num(cfg.frames, 2));
  mark('draw');
}

// ── a settlement's view ────────────────────────────────────────────────────────
async function siteView() {
  if (!R) throw new Error('--site needs the game lighting');
  const { World, retry } = await import('../src/engine/world.js');
  const { MODULES } = await import('../src/settlements/grounds.js');
  const { ARRIVALS } = await import('../src/planet/arrivals.js');
  const { climateAt } = await import('../src/planet/land.js');
  const { openClimate } = await import('../src/planet/climates.js');
  const id = cfg.site;
  if (!MODULES[id]) throw new Error(`no settlement of its own called ${id}`);
  const world = new World(R);
  await world.init();
  // nothing but this settlement, and only what was chosen of it
  world.ensureNear = async () => {};
  const site = world.byId[id];
  world.setAnchor(site.S.frame, site); world.tilt.identity();
  mark('world');
  // the pose: the settlement's arrival, or as asked (x, y, z, yaw, pitch; y empty or 'g': on the ground)
  let a;
  if (cfg.arrival) { a = ARRIVALS[id]; if (!a) throw new Error(`no arrival for ${id}`); a = [...a]; }
  else a = String(cfg.at).split(',').map((v) => (v === '' || v === 'g' || v === 'null' ? null : +v));
  const [x, , z] = a, yaw = a[3] || 0, pitch = a[4] || 0;
  // the plans near: each within `radius` of the camera's ground point (by its bounds)
  const mod = await retry(MODULES[id]);
  site.music = mod.music;
  const town = await mod.town();
  mark('layout');
  const radius = num(cfg.radius, 150);
  // the plans near, the town's cut down to their elements within reach (tools/lib/near.mjs)
  const { nearPlans } = await import('/tools/lib/near.mjs');
  const all = [...mod.landmarks.map((p) => ({ plan: p.plan, music: p.music, landmark: true })), ...town.map((p) => ({ plan: p, music: null }))];
  const picked = nearPlans(all, x, z, radius, cfg.trim || 'town');
  const chosen = picked.entries.map((e) => [e.plan, e.music]), elsKept = picked.kept, elsAll = picked.total;
  site.state = 'loading'; world.scene.add(site.group); site.lifeParts = []; site.done = 0; site.expected = chosen.length;
  site.loading = Promise.resolve(site);
  const tb = performance.now();
  for (const [plan, music] of chosen) await site.addPart(plan.id, plan, music, site.gen);
  site.buildLife(); site.state = 'ready';
  await site.mergeStatic?.(site.gen);
  const buildSeconds = +((performance.now() - tb) / 1000).toFixed(1);
  mark('build');
  // the feet: on what is there (a floor, a roof, the ground) below the height asked, or on the ground
  const C = site.collide;
  let feetY = a[1];
  if (feetY === null || feetY === undefined || !Number.isFinite(feetY)) feetY = C.terrain(x, z);
  else if (!cfg.free) { const g = C.groundAt(x, z, feetY + 0.4); if (Number.isFinite(g)) feetY = g; }
  const eye = cfg.free ? [x, a[1] ?? feetY + EYE, z] : [x, feetY + EYE, z];
  const ctl = { feet: { x, y: cfg.free ? eye[1] - EYE : feetY, z }, yaw, pitch };
  const place = () => {
    cam.position.set(...eye); cam.rotation.set(pitch, yaw, 0, 'YXZ'); setFov();
    world.place(cam, false);
  };
  place();
  const camPlanet = () => toPlanet(world.anchor.frame, cam.position.toArray());
  await world.terrain.readyAt(camPlanet);
  mark('ground');
  world.update(cam, ctl);
  if (!cfg.noflora) await world.flora.ready(x, z, null, 140);
  mark('plants');
  const rain = new Rain(R.scene);
  // the sky and the exposure as the frame loop sets them (src/main.js frameOnce)
  const frameOnce = () => {
    place();
    const here = world.update(cam, ctl);
    const c = cam.position;
    R.setRange(world.camAlt ?? 2, c.y - C.terrain(c.x, c.z));
    setFov();
    climate.indoors = !here.room || here.room.kind === 'open' ? 0 : 1;
    const u = world.here(ctl), f = world.anchor.frame;
    const zones = [], ns = world.nearestSite(u), open = openClimate(climateAt(u));
    if (ns) {
      const w = 1 - sm(ns.s.S.radius + BLEND * 0.5, ns.s.S.radius + BLEND + 250, ns.r);
      zones.push({ zone: { id: ns.s.id, climate: climateOf(ns.s.S) }, w });
      for (const zz of open) zones.push({ zone: zz.zone, w: zz.w * (1 - w) });
    } else zones.push(...open);
    const cl = sky(site.S, f, dirToLocal(f, u), zones);
    rain.update(10, cl.rain, climate.indoors < 0.5);   // (a long step: the rain, snow or dust at once)
    const openAmb = R.gi.openAmbient();
    let amb = 0;
    for (const [dx, dy, dz] of [[0, 0, 0], [1.2, 0, 0], [-1.2, 0, 0], [0, 0, 1.2], [0, 0, -1.2], [0, 0.9, 0]]) amb = Math.max(amb, R.gi.ambientAt(c.x + dx, c.y + dy, c.z + dz));
    if (!(amb > openAmb * 0.004)) amb = openAmb;
    const cap = here.building ? 8 + 6 * (1 - cl.day) : 1.6 + 1.4 * (1 - cl.day);
    const target = exposureOf(cl) * Math.min(cap, Math.max(1, Math.pow(openAmb / Math.max(amb, 1e-4), 0.55)));
    const v = cam.getWorldDirection(new THREE.Vector3());
    const sunUp = Math.max(0, Math.min(1, ENV.sunDir.value.y * 6 + 0.3)), toward = Math.max(0, Math.min(1, (v.dot(ENV.sunDir.value) - 0.55) / 0.4));
    renderer.toneMappingExposure = target * (1 - 0.42 * sunUp * toward * toward * (3 - 2 * toward));
  };
  frameOnce();
  await draw(num(cfg.frames, 2), frameOnce);
  mark('draw');
  window.INFO = { site: id, pose: [x, feetY, z, yaw, pitch], cam: eye, fov, radius, plans: chosen.length, of: all.length, elements: elsKept, elementsOf: elsAll, hour,
    buildSeconds, exposure: renderer.toneMappingExposure, draws: LAST_DRAWS };
}
function sm(e0, e1, x) { const q = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return q * q * (3 - 2 * q); }
</script></body></html>
