# Check the plans and publish the static site to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 16

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dev tools (no browsers are downloaded)
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # the code goes under a folder named for this commit, so that a visitor's browser never mixes
      # cached files of the last version with the new ones (Pages lets browsers keep files 10 min)
      - name: Assemble the site
        run: |
          V=${GITHUB_SHA::8}
          mkdir -p _site/v/$V
          cp -r data _site/
          cp -r src _site/v/$V/
          # the code of the last versions too (eight): a page opened before this deploy still finds the
          # modules it fetches later (a settlement, a worker) under its own folder
          for C in $(git rev-list --skip=1 --max-count=8 HEAD); do
            O=${C::8}; mkdir -p _site/v/$O
            git archive "$C" src | tar -x -C _site/v/$O || rm -rf _site/v/$O
          done
          sed -e "s#\"src/#\"v/$V/src/#g" -e "s#\"\./src/#\"./v/$V/src/#g" index.html > _site/index.html
          grep -q "./v/$V/src/vendor/three/build/three.webgpu.js" _site/index.html
          grep -q "v/$V/src/main.js" _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000   # the site is ~85 MB with the kept versions; Pages' sync can pass the 10-minute default
